<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Roller Options</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 24px;
        max-width: 560px;
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      input[type="number"] {
        width: 140px;
        padding: 8px;
      }

      .hint {
        font-weight: 400;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      button {
        width: fit-content;
        padding: 8px 14px;
      }

      #status {
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>Tab Roller (working title)</h1>
    <p>
      Configure how Reload All Tabs runs. Rolling mode is active-tab-first, then left-to-right serial reload.
    </p>

    <form id="settings-form">
      <label for="rollingEnabled">
        <input id="rollingEnabled" name="rollingEnabled" type="checkbox" />
        Enable rolling mode
        <span class="hint">Locks behavior to 1 tab at a time with 3s cooloff.</span>
      </label>

      <label for="batchSize">
        Tabs at a time
        <input id="batchSize" name="batchSize" type="number" min="1" step="1" required />
        <span class="hint">Used only when rolling mode is disabled.</span>
      </label>

      <label for="cooldownSeconds">
        Cooldown (seconds)
        <input
          id="cooldownSeconds"
          name="cooldownSeconds"
          type="number"
          min="5"
          step="1"
          required
        />
        <span class="hint">Used only when rolling mode is disabled. Minimum 5 seconds.</span>
      </label>

      <button type="submit">Save</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <script src="options.js"></script>
  </body>
</html>
